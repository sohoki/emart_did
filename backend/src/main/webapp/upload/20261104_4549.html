<!DOCTYPE HTML>
<html>
<head>
<meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>문화센터 정리</title>
<script type='text/javascript' src='/upload/jquery-2.2.4.min.js'></script>
<script type='text/javascript'>
    var albumLst0 = '[]';
    var contentCount0 = 0;
    var jsonData0;
    var firstPlay0, errorFlag0;
    var prepareFileNm0, prepareFileType0, prepareFileTime0, prepareFileStreCours0, prepareMakeType0;
    $(document).ready(function(){
        console.log('contents play start');
        function startContentSch(){
            jsonData0 = JSON.parse(albumLst0);
            if(jsonData0.length > 0){
                firstPlay0 = true;
                tagMaking0(jsonData0[contentCount0].streFileNm, jsonData0[contentCount0].mediaType, jsonData0[contentCount0].timeInterval, jsonData0[contentCount0].fileStreCours, 'A');
            }
        }
        startContentSch();
    });
    function tagMaking0(fileNm, fileType, fileInterval, fileStreCours, makeType){
        var result, mediaTag;
        if (makeType == 'A'){
            $('#content_show0a').html('');
            switch(fileType){
                case 'IMAGE' : result = '<img id="content0a" src="/upload'+fileStreCours+fileNm+'" width="1920" height="1080" />'; break;
                case 'MEDIA' : result = '<video id="content0a" src="/upload'+fileStreCours+fileNm+'"><source type="video/mp4"/></video>'; break;
                default      : result = '<audio id="content0a" controls src="/upload'+fileStreCours+fileNm+'"><source type="audio/mpeg"/></audio>'; break;
            }
            mediaTag = $('#content0a');
            $('#content_show0a').html(result);
        } else {
            $('#content_show0b').html('');
            switch(fileType){
                case 'IMAGE' : result = '<img id="content0b" src="/upload'+fileStreCours+fileNm+'" width="1920" height="1080" />'; break;
                case 'MEDIA' : result = '<video id="content0b" src="/upload'+fileStreCours+fileNm+'"><source type="video/mp4"/></video>'; break;
                default      : result = '<audio id="content0b" controls src="/upload'+fileStreCours+fileNm+'"><source type="audio/mpeg"/></audio>'; break;
            }
            mediaTag = $('#content0b');
            $('#content_show0b').html(result);
        }
        if(firstPlay0){
            firstPlay0 = false;
            mediaPlaySetting0(fileNm, fileType, fileInterval, fileStreCours, makeType);
        } else if (errorFlag0){
            errorFlag0 = false;
            mediaPlaySetting0(fileNm, fileType, fileInterval, fileStreCours, makeType);
        } else {
            prepareFileNm0 = fileNm;
            prepareFileType0 = fileType;
            prepareFileTime0 = fileInterval;
            prepareFileStreCours0 = fileStreCours;
            prepareMakeType0 = makeType;
        }
    }
    function mediaPlaySetting0(fileNm, fileType, fileInterval, fileStreCours, makeType){
        var mediaTag;
        var contentLoadCheck = setTimeout(function(){
            console.log('CONTENTS LOADING ISSUE, NEXT !');
            nextSeqConChk0('1', makeTypeRevers(makeType));
        }, 3000);
        var contentPauseChk = setTimeout(function(){
            console.log('content Pause ? Play Time : ' + ((fileInterval*1000)+3000));
            nextSeqConChk0('2', prepareMakeType0);
        }, ((fileInterval*1000)+3000));
        switch(makeType){
            case 'A' : mediaTag = $('#content0a'); $('#content_show0b').css('z-index', '150'); break;
            case 'B' : mediaTag = $('#content0b'); $('#content_show0b').css('z-index', '300'); break;
        }
        if(fileType == 'IMAGE'){
            mediaTag.each(function(){
                clearTimeout(contentLoadCheck);
                setTimeout(function(){
                    clearTimeout(contentPauseChk);
                    nextSeqConChk0('2', prepareMakeType0);
                }, fileInterval*1000);
                nextSeqConChk0('1', makeTypeRevers(makeType));
            });
        } else {
            mediaTag[0].autoplay = true;
            mediaTag[0].src = '/upload' + fileStreCours+fileNm + '?autoplay=1';
            var playPromise = mediaTag[0].play();
            if (playPromise && playPromise.catch) {
                playPromise.catch(function(){ mediaTag[0].muted = true; mediaTag[0].play(); });
            }
            mediaTag.on('loadeddata', function(){
                clearTimeout(contentLoadCheck);
                nextSeqConChk0('1', makeTypeRevers(makeType));
            });
            mediaTag.on('ended', function(){
                clearTimeout(contentPauseChk);
                nextSeqConChk0('2', prepareMakeType0);
            });
        }
        mediaTag.on('error', function(err){
            clearTimeout(contentLoadCheck);
            clearTimeout(contentPauseChk);
            console.log('CONTENT NAME : ' + fileNm + ', ERROR !');
            errorFlag0 = true;
            nextSeqConChk0('1', makeType);
        });
    }
    function nextSeqConChk0(checkType, makeType){
        if(contentCount0 == jsonData0.length){
            location.href = document.location.href;
        } else {
            if(checkType == '1'){
                contentCount0++;
                if(contentCount0 != jsonData0.length){
                    tagMaking0(jsonData0[contentCount0].streFileNm, jsonData0[contentCount0].mediaType, jsonData0[contentCount0].timeInterval, jsonData0[contentCount0].fileStreCours, makeType);
                }
            } else {
                mediaPlaySetting0(prepareFileNm0, prepareFileType0, prepareFileTime0, prepareFileStreCours0, prepareMakeType0);
            }
        }
    }
    function makeTypeRevers(makeType){
        if(makeType == 'A'){
            return 'B';
        } else {
            return 'A';
        }
    }
</script>
<style>
    body{
        margin : 0;
        background-color : #000;
    }
    .contentBox0{
        position : fixed;
        top : 0;
        width: 1920px; height: 1080px;
        float : left;
        background-color : #000;
    }
    .contentBox0 video{
        width: 1920px; height: 1080px;
        min-width: 1920px; min-height: 1080px;
    }
</style>
</head>
<body>
    <iframe src='/upload/silence.mp3' allow='autoplay' id='setAudio' style='display:none'></iframe>
    <div id='content_show0a' class='contentBox0' style='z-index:200;'></div>
    <div id='content_show0b' class='contentBox0' style='z-index:150;'></div>
</body>
</html>
