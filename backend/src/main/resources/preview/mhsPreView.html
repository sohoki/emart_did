<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>이마트 회의실알림이</title>
    <link rel="stylesheet" href="/css/paragraph_M.css">
    <link rel="stylesheet" href="/css/reset_M.css">
    <script type="text/javascript" src="/js/jquery-2.2.4.min.js"></script>
    <style>
        /* 단말(1920x1080) 화면에서 스크롤이 생기지 않도록 고정 */
        html, body { height: 100%; overflow: hidden; }
        /* 레거시는 .wrap 이 <form> 안에 있어 min-height:100% 가 무효였음 — form 없이 쓰면 헤더가
           화면 전체 높이를 차지해 본문이 화면 아래로 밀려나므로 해제 */
        .wrap { min-height: 0; }
        .main_slider { overflow: hidden; }
        .view_hide { display: none; }
    </style>
</head>
<body>
<!-- 레거시 emart_cms3.2.1 roomManage/preView.jsp 이관 — 문화센터(MHS) 룸 단말(키오스크) 화면.
     데이터는 로그인 없이 호출 가능한 /api/backoffice/sub/roomManage/mhs/device/preview.do 로 조회한다.
     레거시는 슬라이드 4장(리스트/강의카드 x2)을 순환했지만, 단말에서 스크롤이 생겨
     오늘 남은 강의가 있으면 리스트 화면, 없으면 "현재 진행중인 강의가 없습니다" 화면 하나만 보여준다. -->
<input type="hidden" id="mhsMonitorcd" value="">
<input type="hidden" id="hid_time">
<input type="hidden" id="searchDay" value="">
<div class="wrap">
    <div class="header">
        <div class="contents">
            <div class="float_left">
                <span class="room_name" id="room_name"></span>
                <span class="floor" id="floor"></span>
            </div>
            <div class="float_right">
                <ul class="date">
                    <li><span id="day"></span></li>
                    <li><span id="sp_week"></span></li>
                </ul>
                <p class="time" id="time"></p>
            </div>
            <div class="clear"></div>
        </div>
    </div>
</div>
<div class="main_slider">
    <!-- 강의 리스트 화면(레거시 slide01) -->
    <div class="slide01 view_hide" id="view_list">
        <div class="contents">
            <h2 class="slider_tit">문화센터 강의 현황</h2>
            <table class="meeting_list" id="meeting_list">
                <thead>
                    <tr><th>시간</th><th>강의명</th><th>강사명</th><th>비고</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <!-- 진행중인 강의 없음 화면(레거시 slide02) -->
    <div class="slide02" id="view_none">
        <div class="contents">
            <div class="margin-top90">
                <div class="meeting_tit">
                    <p class="meeting_noti">강의 제목</p>
                    <h3 class="meeting_txt"><span id="sp_classNm">현재 진행중인 강의가 없습니다</span></h3>
                </div>
                <div class="float_right">
                    <span class="offMeeting" id="onMeeting"></span>
                </div>
                <div class="clear"></div>
            </div>
            <div class="user_nam text-right" id="user_nam_text-right"></div>
            <div class="next_reser">
                <ul>
                    <li>다음 강의</li>
                    <li><span id="sp_nextInfo">예정된 강의가 없습니다.</span></li>
                </ul>
                <div class="clear"></div>
            </div>
        </div>
    </div>
</div>
<div class="footer">
    <div class="contents">
        <h1><img src="/img/cc_logo.png" alt="이마트로고" width="360" height="100"></h1>
    </div>
</div>

<script type="text/javascript">
    var dayCnt = 0;
    var reloadCnt = 0;

    $(document).ready(function () {
        var params = new URLSearchParams(location.search);
        $('#mhsMonitorcd').val(params.get('mhsMonitorcd') || '');
        $('#searchDay').val(params.get('searchDay') || '');

        day_view();
        classInfo();
        // 1초마다 시계, 1분마다 편성 재조회, 1시간마다 새로고침(레거시 동일)
        setInterval(function () {
            day_view();
            dayCnt++;
            if (dayCnt == 60) {
                classInfo();
                dayCnt = 0;
                reloadCnt++;
            }
            if (reloadCnt == 60) {
                location.reload();
            }
        }, 1000);
    });

    function pad2(n) {
        return (n < 10 ? '0' : '') + n;
    }

    // 화면 출력용 문자열 이스케이프(강의명/강사명 등 사용자 입력값)
    function esc(v) {
        return $('<div>').text(v == null ? '' : v).html();
    }

    function day_view() {
        var d = new Date();
        var week = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
        $('#sp_week').text(week[d.getDay()]);
        $('#hid_time').val(pad2(d.getHours()) + pad2(d.getMinutes()));
        $('#day').text((d.getMonth() + 1) + '월 ' + d.getDate() + '일');
        $('#time').text(d.getHours() + '시 ' + d.getMinutes() + '분');
    }

    // 강의 있음 → 리스트 화면, 없음 → 진행중인 강의 없음 화면
    function showView(hasClass) {
        $('#view_list').toggleClass('view_hide', !hasClass);
        $('#view_none').toggleClass('view_hide', hasClass);
    }

    function classInfo() {
        var url = '/api/backoffice/sub/roomManage/mhs/device/preview.do?mhsMonitorcd=' + encodeURIComponent($('#mhsMonitorcd').val());
        if ($('#searchDay').val()) {
            url += '&searchDay=' + encodeURIComponent($('#searchDay').val());
        }
        $.ajax({
            url: url,
            type: 'GET',
            dataType: 'json',
            success: function (res) {
                var result = res && res.result;
                if (!result) {
                    return;
                }
                var info = result.monitorInfo || {};
                $('#room_name').html(esc(info.mhsMonitornm));
                $('#floor').html(esc(info.mhsCenternm));

                // 오늘 진행중/예정 강의 리스트(종료된 강의는 제외 — 레거시 동일)
                var nowTime = parseInt($('#hid_time').val(), 10);
                var data = result.resultList || [];
                var rows = '';
                for (var i = 0; i < data.length; i++) {
                    var start = parseInt(data[i].mhsClassstarttime, 10);
                    var end = parseInt(data[i].mhsClassendtime, 10);
                    var time = fn_timeSplit(data[i].mhsClassstarttime) + '~' + fn_timeSplit(data[i].mhsClassendtime);
                    if (nowTime >= start && end > nowTime) {
                        rows += "<tr class='meeting_active'><td>" + time + "</td>"
                            + "<td><span class='meeting_on'>" + esc(data[i].mhsClassnm) + "</span></td>"
                            + "<td>" + esc(data[i].mhsTeachernm) + "</td>"
                            + "<td>" + esc(data[i].mhsClassintro) + "</td></tr>";
                    } else if (nowTime < start) {
                        rows += "<tr><td>" + time + "</td>"
                            + "<td>" + esc(data[i].mhsClassnm) + "</td>"
                            + "<td>" + esc(data[i].mhsTeachernm) + "</td>"
                            + "<td>" + esc(data[i].mhsClassintro) + "</td></tr>";
                    }
                }
                $('#meeting_list > tbody').html(rows);

                // 강의 없음 화면 — 회색 배지(현재시각~다음 강의 시작 또는 23:00) + 다음 강의
                var pageData = result.pageInfo || [];
                var next = null;
                for (var j = 0; j < pageData.length; j++) {
                    if (pageData[j].mhsNowgubun == 'NEXT') {
                        next = pageData[j];
                        break;
                    }
                }
                var nowText = fn_timeSplit($('#hid_time').val());
                if (next) {
                    $('#onMeeting').text(nowText + '~' + fn_timeSplit(next.mhsClassstarttime));
                    $('#sp_nextInfo').html(fn_timeSplit(next.mhsClassstarttime) + '~' + fn_timeSplit(next.mhsClassendtime) + ' ' + esc(next.mhsTeachernm));
                } else {
                    $('#onMeeting').text(nowText + '~23:00');
                    $('#sp_nextInfo').text('예정된 강의가 없습니다.');
                }

                showView(rows !== '');
            },
            error: function (e) {
                console.log(e);
            }
        });
    }

    function fn_timeSplit(time) {
        time = time == null ? '' : String(time);
        return time.length > 3 ? time.substring(0, 2) + ':' + time.substring(2, 4) : time;
    }
</script>
</body>
</html>
