# log4jdbc-log4j2(net.sf.log4jdbc) 설정 파일 — 클래스패스 루트(src/main/resources)에 있어야
# 자동으로 읽힘. local 프로파일의 Globals.postgresql.Url(jdbc:log4jdbc:postgresql://...)이
# net.sf.log4jdbc.sql.jdbcapi.DriverSpy를 거치도록 연결됐을 때만 실제로 사용됨.
#
# 실제 로그 출력 on/off 및 레벨은 application.yml의 logging.level.jdbc.* (jdbc.sqltiming 등)로
# 조절한다 — 여기는 "찍힐 때 어떤 모양으로 찍을지"만 담당.

# 0이면 줄 길이 제한 없이 SQL을 여러 줄로 예쁘게(pretty-print) 포맷 — 기본값(단일 라인)이라
# 조인이 많은 쿼리가 한 줄로 길게 찍히던 문제를 해결하기 위한 설정
log4jdbc.dump.sql.maxlinelength=0

# 바인딩된 파라미터 값이 채워진 실제 SQL을 SLF4J(Logback)로 출력 — 이 프로젝트는 실제 Log4j2
# 프레임워크가 classpath에 없으므로 slf4j 델리게이터를 명시적으로 지정
log4jdbc.spylogdelegator.name=net.sf.log4jdbc.log.slf4j.Slf4jSpyLogDelegator
