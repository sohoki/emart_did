spring:
  profiles:
    active: local
    group:
      local: [local, common]
      prod: [prod, common]
      server: [server, common]
# logging.config(log4j2-*.xml) 제거함: 이 프로젝트는 spring-boot-starter-logging(Logback)만
# 의존성에 있고 실제 Log4j2 프레임워크는 classpath에 없어서, Logback이 log4j2 형식 XML(<Appenders>/
# <Loggers> 태그)을 잘못 파싱해 콘솔 출력이 사실상 막히는 문제가 있었음(부팅 실패 시 실제 예외조차
# 안 보임). log4j2-*.xml 자체는 log4jdbc-log4j2(JDBC 프록시 드라이버, SQL 로그 노이즈 필터링용)가
# 참조하도록 작성된 것으로 보이나 현재 연결되어 있지 않음 — 필요 시 spring-boot-starter-log4j2로
# 전환 + spring-boot-starter-logging 제외하는 별도 작업 필요(후속)
