springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    # MyBatis 쿼리 로그(==> Preparing / ==> Parameters / <== Total). local 프로파일과 동일하게
    # 추가함 — IDE Run Configuration에서 SPRING_PROFILES_ACTIVE를 prod/server로 지정해 로컬에서
    # 띄우는 경우에도 SQL 로그가 보이지 않던 문제 확인 후 반영
    com.common.backoffice: debug
    egovframework.let: debug
