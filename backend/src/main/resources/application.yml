#################### local 영역 ####################
---
spring:
  jmx:
    enabled: false
  config:
    activate:
      on-profile: local
  application:
    admin:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
# Swagger 비활성화 (운영 보안 — API 명세 외부 노출 차단)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    # MyBatis 쿼리 로그(==> Preparing / ==> Parameters / <== Total). 매퍼 namespace(=인터페이스
    # FQCN)를 로거로 써서 SLF4J 경유로 Logback에 찍힘. 예전 log4j2-local.xml의 SQL 로깅을
    # 표준 logging.level 프로퍼티로 대체(로그 설정 전체 정리는 20절 후속 과제로 남겨둠)
    com.common.backoffice: debug
    egovframework.let: debug
    jdbc.sqlonly: off         # sqlonly는 꺼두고 sqltiming과 포매터 조합을 주로 사용합니다
    jdbc.sqltiming: debug     # 실행 시간과 함께 실제 바인딩된 쿼리 출력
    jdbc.audit: off
    jdbc.resultset: off
    jdbc.resultsettable: off
    # log4jdbc 내부 구현 로거 레벨 조정
    jdbc.connection: off
# 구동 서버 정보
server:
  port : 7004
  tomcat:
    max-http-form-post-size: 30MB #파일 제외 폼 데이터(멀티파트 텍스트 필드) 크기 제한 - 기본 2MB로는 에디터 본문이 잘림
  servlet:
    context-path: /
    session:
      timeout : 3600
