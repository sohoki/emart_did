<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oracle → PostgreSQL 이관</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; font-size: 13px; margin: 16px; color: #222; background: #fff; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    h2 { font-size: 15px; margin: 20px 0 8px; }
    .box { border: 1px solid #ccc; border-radius: 4px; padding: 10px; margin-bottom: 10px; background: #fafafa; }
    .warn { color: #b00; font-weight: bold; }
    .ok { color: #070; }
    button { padding: 6px 12px; margin-right: 6px; cursor: pointer; }
    button.danger { background: #c62828; color: #fff; border: 1px solid #a00; }
    button.primary { background: #1565c0; color: #fff; border: 1px solid #0d47a1; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 4px 6px; text-align: left; vertical-align: top; }
    th { background: #eee; position: sticky; top: 0; }
    tr.disabled td { color: #999; }
    .scroll { max-height: 480px; overflow: auto; }
    .num { text-align: right; }
    .st-DONE { color: #070; font-weight: bold; }
    .st-ERROR { color: #b00; font-weight: bold; }
    .st-RUNNING { color: #1565c0; font-weight: bold; }
    .st-SKIP, .st-CANCELED { color: #888; }
    pre { white-space: pre-wrap; margin: 0; }
  </style>
</head>
<body>
  <h1>Oracle(EMARTCMS) → PostgreSQL 이관 — 한글 MS949 복원 + 있으면 UPDATE / 없으면 INSERT</h1>

  <div class="box" id="config">설정 불러오는 중…</div>

  <div class="box">
    <button onclick="loadTables()">1. 테이블 불러오기</button>
    <button onclick="preview()">2. 미리보기 (선택 1개, 한글 확인)</button>
    <button class="primary" onclick="run(true)">3. 점검 실행 (dry run, 롤백)</button>
    <button class="danger" onclick="run(false)">4. 실제 이관</button>
    <button onclick="cancelJob()">취소</button>
    <label><input type="checkbox" id="checkAll" onchange="toggleAll(this.checked)"> 이관 가능한 테이블 전체 선택</label>
  </div>

  <h2>테이블</h2>
  <div class="scroll"><table id="tables"><tbody><tr><td>[1. 테이블 불러오기]를 누르세요.</td></tr></tbody></table></div>

  <h2>미리보기</h2>
  <div class="scroll" id="preview">-</div>

  <h2>실행 결과 <span id="jobInfo"></span></h2>
  <div class="scroll"><table id="results"><tbody><tr><td>-</td></tr></tbody></table></div>

  <script>
    const api = '/api/migration';
    let pollTimer = null;

    async function call(url, options) {
      const res = await fetch(url, options);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(body.error || res.statusText);
      }
      return body;
    }

    function esc(v) {
      if (v === null || v === undefined) {
        return '<span style="color:#aaa">null</span>';
      }
      return String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    async function loadConfig() {
      try {
        const c = await call(api + '/config');
        const pw = ok => ok ? '<span class="ok">입력됨</span>' : '<span class="warn">비어 있음 — application.yml 에 입력 필요</span>';
        document.getElementById('config').innerHTML =
          '<b>원본 Oracle</b> ' + esc(c.oracleUrl) + ' / ' + esc(c.oracleUser) + ' (스키마 ' + esc(c.oracleSchema) + ') 비밀번호: ' + pw(c.oraclePasswordSet) + '<br>' +
          '<b>대상 PostgreSQL</b> ' + esc(c.postgresUrl) + ' / ' + esc(c.postgresUser) + ' (스키마 ' + esc(c.postgresSchema) + ') 비밀번호: ' + pw(c.postgresPasswordSet) + '<br>' +
          '<b>한글 문자셋</b> ' + esc(c.sourceCharset) + ' &nbsp; <b>테이블 이름 변경</b> ' + esc(JSON.stringify(c.tableMap));
      } catch (e) {
        document.getElementById('config').innerHTML = '<span class="warn">설정 조회 실패: ' + esc(e.message) + '</span>';
      }
    }

    async function loadTables() {
      const tbody = document.querySelector('#tables tbody');
      tbody.innerHTML = '<tr><td>불러오는 중… (Oracle / PostgreSQL 메타데이터 조회)</td></tr>';
      try {
        const list = await call(api + '/tables');
        let html = '<tr><th></th><th>Oracle 테이블</th><th>대상(PostgreSQL)</th><th class="num">행 수(통계)</th><th>비교 키</th><th>제외 컬럼</th><th>문제</th></tr>';
        list.forEach(t => {
          const can = !t.problem;
          html += '<tr class="' + (can ? '' : 'disabled') + '">' +
            '<td><input type="checkbox" class="tbl" value="' + esc(t.oracleTable) + '" data-ok="' + can + '"' + (can ? '' : ' disabled') + '></td>' +
            '<td><label><input type="radio" name="pv" value="' + esc(t.oracleTable) + '"> ' + esc(t.oracleTable) + '</label></td>' +
            '<td>' + esc(t.targetTable) + '</td>' +
            '<td class="num">' + (t.numRows === null ? '-' : t.numRows.toLocaleString()) + '</td>' +
            '<td>' + esc(t.keyColumns.join(', ')) + ' <small>(' + esc(t.keySource) + ')</small></td>' +
            '<td>' + esc(t.skippedColumns.join(', ')) + '</td>' +
            '<td class="warn">' + (t.problem ? esc(t.problem) : '') + '</td>' +
            '</tr>';
        });
        tbody.innerHTML = html;
      } catch (e) {
        tbody.innerHTML = '<tr><td class="warn">조회 실패: ' + esc(e.message) + '</td></tr>';
      }
    }

    function toggleAll(checked) {
      document.querySelectorAll('input.tbl').forEach(cb => {
        if (cb.dataset.ok === 'true') {
          cb.checked = checked;
        }
      });
    }

    function selectedTables() {
      return Array.from(document.querySelectorAll('input.tbl:checked')).map(cb => cb.value);
    }

    async function preview() {
      const radio = document.querySelector('input[name="pv"]:checked');
      const box = document.getElementById('preview');
      if (!radio) {
        alert('미리볼 테이블을 테이블명 앞 동그라미로 하나 선택하세요.');
        return;
      }
      box.innerHTML = '조회 중…';
      try {
        const p = await call(api + '/preview?limit=20&table=' + encodeURIComponent(radio.value));
        let html = '<b>' + esc(p.table) + '</b> 상위 ' + p.rows.length + '행 (Oracle 원본 바이트 → MS949)';
        if (p.warnings.length) {
          html += '<div class="warn">디코딩 경고 ' + p.warnings.length + '건: ' + esc(p.warnings.slice(0, 5).join(' / ')) + '</div>';
        }
        if (p.rows.length) {
          const cols = Object.keys(p.rows[0]);
          html += '<table><tr>' + cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>';
          p.rows.forEach(r => {
            html += '<tr>' + cols.map(c => '<td>' + esc(r[c]) + '</td>').join('') + '</tr>';
          });
          html += '</table>';
        }
        box.innerHTML = html;
      } catch (e) {
        box.innerHTML = '<span class="warn">미리보기 실패: ' + esc(e.message) + '</span>';
      }
    }

    async function run(dryRun) {
      const tables = selectedTables();
      if (!tables.length) {
        alert('이관할 테이블을 체크하세요.');
        return;
      }
      const msg = dryRun
        ? tables.length + '개 테이블을 점검합니다. (처리 후 롤백 — 데이터 변경 없음)'
        : '⚠️ ' + tables.length + '개 테이블을 실제로 이관합니다.\n대상 PostgreSQL 데이터가 UPDATE / INSERT 됩니다. 진행할까요?';
      if (!confirm(msg)) {
        return;
      }
      try {
        renderStatus(await call(api + '/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tables: tables, dryRun: dryRun })
        }));
        startPolling();
      } catch (e) {
        alert('실행 실패: ' + e.message);
      }
    }

    async function cancelJob() {
      try {
        renderStatus(await call(api + '/cancel', { method: 'POST' }));
      } catch (e) {
        alert('취소 실패: ' + e.message);
      }
    }

    function startPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
      }
      pollTimer = setInterval(async () => {
        try {
          const s = await call(api + '/status');
          renderStatus(s);
          if (!s.running) {
            clearInterval(pollTimer);
            pollTimer = null;
          }
        } catch (e) {
          console.error(e);
        }
      }, 2000);
    }

    function renderStatus(s) {
      document.getElementById('jobInfo').innerHTML = s.startedAt
        ? '— ' + (s.dryRun ? '[점검]' : '<span class="warn">[실제 이관]</span>') + ' 시작 ' + esc(s.startedAt) +
          (s.running ? ' / 진행 중: ' + esc(s.currentTable || '') : ' / 종료 ' + esc(s.finishedAt))
        : '';
      let html = '<tr><th>Oracle 테이블</th><th>대상</th><th>상태</th><th class="num">읽은 행</th><th class="num">UPDATE</th><th class="num">INSERT</th><th class="num">디코딩 경고</th><th class="num">초</th><th>메세지</th></tr>';
      (s.results || []).forEach(r => {
        html += '<tr>' +
          '<td>' + esc(r.oracleTable) + '</td>' +
          '<td>' + esc(r.targetTable) + '</td>' +
          '<td class="st-' + r.status + '">' + r.status + '</td>' +
          '<td class="num">' + r.readRows.toLocaleString() + '</td>' +
          '<td class="num">' + r.updatedRows.toLocaleString() + '</td>' +
          '<td class="num">' + r.insertedRows.toLocaleString() + '</td>' +
          '<td class="num" title="' + esc(r.warningSamples.join('\n')) + '">' + r.decodeWarnings + '</td>' +
          '<td class="num">' + (r.elapsedMs / 1000).toFixed(1) + '</td>' +
          '<td><pre>' + esc(r.message || '') + (r.warningSamples.length ? '\n경고 예: ' + esc(r.warningSamples.join(' / ')) : '') + '</pre></td>' +
          '</tr>';
      });
      document.querySelector('#results tbody').innerHTML = html;
    }

    loadConfig();
    call(api + '/status').then(s => {
      renderStatus(s);
      if (s.running) {
        startPolling();
      }
    }).catch(() => {});
  </script>
</body>
</html>
